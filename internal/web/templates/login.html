{{define "title"}}Ingresar{{end}}
{{define "content"}}
<div class="card">
  <h1>Ingresar al panel</h1>
  {{with .Error}}<div class="flash error">{{icon "alert"}}<div>{{.}}</div></div>{{end}}
  <form method="post" action="/login" class="stack">
    <label>Email <input type="email" name="email" value="{{.Email}}" required autofocus autocomplete="username"></label>
    <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit" class="primary">{{icon "lock"}} Ingresar</button>
  </form>
</div>
{{end}}
